<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}MNEA — Auth{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# CSRF token for JavaScript fetch (admin reset, etc.) #}
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="stylesheet" href="{{ url_for('auth.static', filename='css/auth.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  <script src="{{ url_for('auth.static', filename='js/auth.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
