<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../assets/js/desktop-layout-viewport.js"></script>
  <title>Website Settings | Admin</title>
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <style>
    /* Page Content flow: no dashboard sidebar (same idea as admin-content.html) */
    .settings-page-wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
      width: 100%;
      box-sizing: border-box;
    }
    .settings-page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }
    .settings-page-header h1 { margin: 0; font-size: 1.35rem; color: var(--primary, #1e3a5f); }
    .settings-footer-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 0.75rem; margin-top: 1.5rem; }
    .settings-footer-actions .btn-logout {
      padding: 0.45rem 0.9rem; background: transparent; border: 1px solid var(--border); border-radius: var(--radius-sm, 6px);
      color: var(--text-muted); cursor: pointer; font-size: 0.9rem;
    }
    .settings-footer-actions .btn-logout:hover { background: var(--surface-hover); color: var(--primary); }
    .settings-form { max-width: 100%; }
    .settings-form .form-group { margin-bottom: 1rem; }
    .settings-form label { display: block; font-weight: 600; color: var(--primary); margin-bottom: 0.35rem; }
    .settings-form input[type="text"], .settings-form input[type="email"], .settings-form textarea { width: 100%; padding: 0.5rem 0.65rem; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }
    .settings-form textarea { min-height: 60px; resize: vertical; }
    .settings-form .hint { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem; }
    .settings-section { background: #fff; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; box-shadow: 0 2px 8px rgba(0,0,0,.06); border: 1px solid var(--border); }
    .settings-section h2 { margin: 0 0 1rem 0; font-size: 1.1rem; color: var(--primary); }
    .btn-save { padding: 0.6rem 1.5rem; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; }
    .btn-save:hover { opacity: 0.9; }
    .logo-preview-wrap { margin-top: 0.5rem; }
    .logo-preview-wrap img { max-height: 48px; max-width: 180px; object-fit: contain; border: 1px solid var(--border); border-radius: 6px; }
  </style>
</head>
<body class="admin-dashboard-glass">
  <div class="settings-page-wrap glass-dashboard">
      <div class="settings-page-header">
        <h1>Website Settings</h1>
      </div>

      <p class="text-muted" style="margin-bottom:1.25rem;">, , Email, Logo,     </p>

      <form id="websiteSettingsForm" class="settings-form">
        <div class="settings-section">
          <h2>&#x1F550;   (Operating Hours)</h2>
          <div class="form-group">
            <label>English (e.g. Mon–Fri 8:30 AM – 6:30 PM)</label>
            <input type="text" id="site_hours_en" placeholder="&#x1F550; Mon–Fri 8:30 AM – 6:30 PM">
            <div class="hint">  &lt;br&gt; </div>
          </div>
          <div class="form-group">
            <label> (e.g. – : – :)</label>
            <input type="text" id="site_hours_my" placeholder="&#x1F550; – : – :">
            <div class="hint">  &lt;br&gt; </div>
          </div>
        </div>

        <div class="settings-section">
          <h2>&#x1F4DE; </h2>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="text" id="site_phone" placeholder="+95 9 885 511664, +95 9 885 511665">
          </div>
        </div>

        <div class="settings-section">
          <h2>&#x2709;&#xFE0F; Email</h2>
          <div class="form-group">
            <label>Email Address (top bar)</label>
            <input type="email" id="site_email" placeholder="office@mmnea.com">
          </div>
        </div>

        <div class="settings-section">
          <h2>Logo (header )</h2>
          <div class="form-group">
            <label>Logo Image</label>
            <div class="logo-preview-wrap" id="logoPreviewWrap">
              <span id="logoPlaceholder" class="text-muted"> </span>
              <img id="logoPreviewImg" src="" alt="" style="display:none;">
            </div>
            <input type="file" id="upload_logo" accept="image/*" style="margin-top:0.5rem;">
          </div>
        </div>

        <div class="settings-section">
          <h2> (Website Title in Header)</h2>
          <div class="form-group">
            <label>  (e.g. Myanmar New Era International)</label>
            <input type="text" id="site_title_line1" placeholder="Myanmar New Era">
          </div>
          <div class="form-group">
            <label>  (e.g. Education Centre)</label>
            <input type="text" id="site_title_line2" placeholder="International Education Centre">
          </div>
          <div class="form-group">
            <label>  (  )</label>
            <input type="text" id="header_marquee_text" placeholder="Create your new future with us.">
          </div>
        </div>

        <div class="settings-footer-actions">
          <button type="submit" class="btn-save"> (Save)</button>
          <button type="button" class="btn-logout" id="btnLogout">Logout</button>
          <span id="saveStatus" style="color:#16a34a; font-weight:600; display:none;">Changes saved successfully</span>
        </div>
      </form>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="../assets/js/firebase-config.js"></script>
  <script src="../assets/js/content-firebase.js"></script>
  <script src="../assets/js/lang-switcher.js"></script>
  <script src="../assets/js/content-admin.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    (function() {
      var DEFAULT_HOURS_EN = '&#x1F550; Mon–Fri&nbsp;&nbsp;8:30 AM – 6:30 PM&nbsp;·&nbsp;&#x1F550; Sat–Sun&nbsp;&nbsp;9:00 AM – 7:00 PM';
      var DEFAULT_HOURS_MY = '&#x1F550; –&nbsp;&nbsp;: – :&nbsp;·&nbsp;&#x1F550; –&nbsp;&nbsp;: – :';

      function loadSettings() {
        AcademyContent.getSiteContent(function(data) {
          var c = data.content || {};
          document.getElementById('site_hours_en').value = c.site_hours_en || DEFAULT_HOURS_EN;
          document.getElementById('site_hours_my').value = c.site_hours_my || DEFAULT_HOURS_MY;
          document.getElementById('site_phone').value = c.site_phone || '+95 9 885 511664, +95 9 885 511665';
          document.getElementById('site_email').value = c.site_email || 'office@mmnea.com';
          document.getElementById('site_title_line1').value = c.site_title_line1 || 'Myanmar New Era';
          document.getElementById('site_title_line2').value = c.site_title_line2 || 'International Education Centre';
          document.getElementById('header_marquee_text').value = c.header_marquee_text || 'Create your new future with us.';
          var logoUrl = (data.uploads && data.uploads.logo) || AcademyContent.loadUploads().logo;
          var img = document.getElementById('logoPreviewImg');
          var ph = document.getElementById('logoPlaceholder');
          if (logoUrl) { img.src = logoUrl; img.style.display = 'inline-block'; if (ph) ph.style.display = 'none'; }
          else { img.style.display = 'none'; img.src = ''; if (ph) ph.style.display = 'inline'; }
        });
      }

      document.getElementById('upload_logo').addEventListener('change', function() {
        var file = this.files && this.files[0];
        if (!file || !file.type.match(/^image\//)) return;
        var reader = new FileReader();
        reader.onload = function() {
          AcademyContent.saveUpload('logo', reader.result);
          var img = document.getElementById('logoPreviewImg');
          var ph = document.getElementById('logoPlaceholder');
          img.src = reader.result; img.style.display = 'inline-block';
          if (ph) ph.style.display = 'none';
        };
        reader.readAsDataURL(file);
      });

      document.getElementById('websiteSettingsForm').addEventListener('submit', function(e) {
        e.preventDefault();
        AcademyContent.getSiteContent(function(data) {
          var content = data.content || {};
          content.site_hours_en = document.getElementById('site_hours_en').value.trim() || DEFAULT_HOURS_EN;
          content.site_hours_my = document.getElementById('site_hours_my').value.trim() || DEFAULT_HOURS_MY;
          content.site_phone = document.getElementById('site_phone').value.trim() || '';
          content.site_email = document.getElementById('site_email').value.trim() || '';
          content.site_title_line1 = document.getElementById('site_title_line1').value.trim() || 'Myanmar New Era';
          content.site_title_line2 = document.getElementById('site_title_line2').value.trim() || 'International Education Centre';
          content.header_marquee_text = document.getElementById('header_marquee_text').value.trim() || 'Create your new future with us.';
          AcademyContent.save(content);
          var uploads = data.uploads || AcademyContent.loadUploads();
          if (window.AcademyFirebase && AcademyFirebase.isAvailable()) {
            AcademyFirebase.set({ content: content, uploads: uploads, placementTest: data.placementTest || null, blogPosts: data.blogPosts || null }, function() {
              showSaved();
            });
          } else showSaved();
        });
      });

      function showSaved() {
        var st = document.getElementById('saveStatus');
        if (st) {
          st.textContent = 'Changes saved successfully';
          st.style.display = 'inline';
          setTimeout(function() { st.style.display = 'none'; }, 3500);
        }
      }

      var u = window.AcademyAuth && AcademyAuth.currentUser();
      if (!u) window.location.href = '../public-page/login.html';
      else {
        AcademyAuth.getUserProfile(u.uid, function(p) { if ((p && p.role) !== 'admin') window.location.href = '../student/dashboard.html'; });
        document.getElementById('btnLogout').addEventListener('click', function() { AcademyAuth.signOut(function() { window.location.href = '../public-page/index.html'; }); });
        loadSettings();
      }
    })();
  </script>
  <script src="../assets/js/admin-badge.js"></script>
</body>
</html>
